# 前端容器的 nginx 配置。
#
# `/api` 反代到后端，与开发期 Vite 的 proxy 行为一致——前端代码里全是 `/api/...` 的相对
# 路径，两种环境下都同源，不必为部署形态改代码，也不必处理 CORS。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 无路由（Implementation Scope Boundaries），但直接访问子路径或刷新时仍应回到
    # index.html 而非 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ── SSE 需要的三项，缺一条进度就不会实时到达 ──
        #
        # 关缓冲：nginx 默认会攒够一块才转发，进度事件会被压在缓冲里直到分析结束——
        # 界面表现为「一直没动，然后突然完成」。
        proxy_buffering off;
        proxy_cache off;
        # 关 chunked 之外的改写：SSE 是长连接流，Connection 头不能被置成 close。
        proxy_set_header Connection '';

        # 分析是分钟级的，读超时必须大于最长一次分析。默认 60 秒会让 SSE 连接被
        # nginx 主动断开，而界面会显示成「进度连接已断开」——一个由代理制造的假故障。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源带哈希文件名（Vite 产出），可以长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
